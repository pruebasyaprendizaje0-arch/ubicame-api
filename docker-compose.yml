version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ubicame-api
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - PORT=4000
      - DATABASE_URL=postgresql://ubicame_user:ubicame_pass@postgres:5432/ubicame_db?schema=public
      - JWT_SECRET=dev-secret-key-change-in-production-12345
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:3001,https://menuqr.ubicame.cc,https://misreservaciones.ubicame.cc
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: ubicame-postgres
    restart: always
    environment:
      POSTGRES_USER: ubicame_user
      POSTGRES_PASSWORD: ubicame_pass
      POSTGRES_DB: ubicame_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ubicame_user -d ubicame_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: